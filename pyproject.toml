[project]
name = "retirement"
version = "0.1.0"
description = "Retirement portfolio tracker — fetch IRAs from Robinhood and view gain/loss"
requires-python = ">=3.10"
dependencies = [
    "robin-stocks>=3.4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
toml = ["tomli-w>=1.0.0"]

[project.scripts]
Retirement = "retirement.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retirement"]
